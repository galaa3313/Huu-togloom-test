<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тоглоом">
<meta name="theme-color" content="#1a2350">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Хүүгийн тоглоомууд</title>
<style>
/* Single-look arcade design: full-screen canvas, big thumb buttons at the bottom corners */
:root{
  --ink:#ffffff; --night:#1a2350; --sun:#ffcf33; --go:#2fd36b; --stop:#ff4b4b; --boost:#ff8a1f;
  --glass:rgba(16,22,54,.55);
  --display:'Rubik',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:var(--display)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:var(--display);cursor:pointer;border:0;color:inherit}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* menu */
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(120% 80% at 50% 0%,#3b4fb8 0%,#1a2350 70%);overflow:auto}
#menu h1{margin:0;font-weight:900;font-size:clamp(30px,8vw,52px);letter-spacing:.5px;text-align:center;line-height:1.05;text-wrap:balance;
  color:var(--sun);text-shadow:0 4px 0 #b3721b,0 8px 18px rgba(0,0,0,.35)}
#menu p.sub{margin:-10px 0 4px;opacity:.8;font-weight:500;text-align:center}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(640px,100%)}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px 14px 16px;min-width:0;border-radius:24px;
  box-shadow:0 8px 0 rgba(0,0,0,.25);transition:transform .12s}
.card:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.card.car{background:linear-gradient(160deg,#2f8cff,#1d5fd1)}
.card.cut{background:linear-gradient(160deg,#ffb431,#f07d16)}
.card svg{width:100%;height:78px}
.card b{font-size:clamp(18px,4.8vw,24px);font-weight:900;line-height:1.1}
.card span{font-size:13px;font-weight:500;opacity:.95;line-height:1.35}
.card.hero{background:linear-gradient(160deg,#2fbf71,#1d8a52)}
.card.santa{background:linear-gradient(160deg,#e23b4a,#a8182a)}

/* in-game */
#home{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));
  width:52px;height:52px;border-radius:50%;background:#fff;color:#1a2350;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.2);z-index:5}
#home svg{width:24px;height:24px}
#carui .b{position:fixed;display:grid;place-items:center;font-weight:900;letter-spacing:.5px;color:#fff;
  box-shadow:0 6px 0 rgba(0,0,0,.3);touch-action:none;z-index:4}
#carui .b.on{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3);filter:brightness(1.15)}
.steer{width:76px;height:76px;border-radius:50%;background:var(--glass);border:3px solid rgba(255,255,255,.7)!important;
  bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.steer svg{width:34px;height:34px}
#bl{left:calc(14px + env(safe-area-inset-left,0px))}
#br{left:calc(100px + env(safe-area-inset-left,0px))}
#gas{right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:80px;height:134px;border-radius:16px 16px 24px 24px;--rim:var(--go)}
#brk{right:calc(104px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:94px;height:94px;border-radius:16px 16px 24px 24px;--rim:var(--stop)}
#carui .pedal{background:linear-gradient(180deg,#4a5064,#23262f);border:4px solid var(--rim)!important;overflow:hidden;transform-origin:50% 100%}
.pedal::before{content:"";position:absolute;left:10px;right:10px;top:10px;bottom:30px;border-radius:8px;background:repeating-linear-gradient(180deg,#717890 0 5px,#2b2f3c 5px 11px)}
.pedal span{position:absolute;left:0;right:0;bottom:7px;text-align:center;color:var(--rim);font-weight:900;font-size:13px;letter-spacing:.5px}
#carui .pedal.on{transform:perspective(260px) rotateX(24deg);filter:brightness(1.25)}
#horn{left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(112px + env(safe-area-inset-bottom,0px));width:96px;height:52px;border-radius:26px;background:#ffd23f;color:#1a2350!important;font-size:15px}
#horn.siren{background:linear-gradient(90deg,#ff4b4b 50%,#3a8dff 50%);color:#fff!important}
#horn.lit{animation:sirenflash .5s steps(2) infinite}
@keyframes sirenflash{50%{filter:brightness(1.7)}}
.card.traffic{background:linear-gradient(160deg,#9b6bff,#6a3fd6)}
#stageBtn{position:fixed;top:calc(74px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:5;height:44px;padding:0 14px;border-radius:22px;display:flex;align-items:center;gap:6px;background:#fff;color:#1a2350;font-weight:900;font-size:15px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
#stageBtn svg{width:18px;height:18px}
#stagePick{position:fixed;inset:0;z-index:7;display:grid;place-items:center;background:rgba(10,14,40,.6);padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.spbox{width:min(420px,100%);background:#fff;color:#1a2350;border-radius:24px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 0 rgba(0,0,0,.25)}
.spbox h2{margin:0;font-size:24px;font-weight:900;text-align:center}
.spgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px 12px;border-radius:18px;background:#1a2350;color:#fff;position:relative;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.sp svg{width:100%;max-width:120px;height:auto;aspect-ratio:4/3}
.sp b{position:absolute;top:8px;left:10px;width:26px;height:26px;border-radius:50%;background:#ffd23f;color:#1a2350;display:grid;place-items:center;font-size:15px}
.sp span{font-size:15px;font-weight:800;text-align:center}
.sp:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
#spClose{align-self:center;padding:12px 30px;border-radius:16px;background:#e8ecf7;color:#1a2350;font-size:17px;font-weight:900}
.menubtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:-6px}
.mbtn{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.14);font-size:15px;font-weight:800}
.mbtn svg{width:20px;height:20px;flex:none}
.mbtn.off{opacity:.65}
#voicepanel{position:fixed;inset:0;z-index:7;display:grid;place-items:center;background:rgba(10,14,40,.6);padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.vbox{width:min(460px,100%);max-height:100%;overflow:auto;background:#fff;color:#1a2350;border-radius:24px;padding:18px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 0 rgba(0,0,0,.25)}
.vbox h2{margin:0;font-size:24px;font-weight:900;text-align:center}
.vhelp{margin:0;font-size:15px;font-weight:500;line-height:1.4;text-align:center}
#vNote{margin:0;padding:8px 10px;border-radius:12px;background:#ffe8e8;color:#b3261e;font-weight:700;font-size:14px}
#vList{display:flex;flex-direction:column;gap:8px}
.vrow{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-radius:16px;background:#f1f3fa}
.vrow.has{background:#e6f8ee}
.vtxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.vtxt b{font-size:15px;line-height:1.25}
.vtxt small{font-size:12px;font-weight:600;color:#5b6380}
.vb{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#dfe4f2;color:#1a2350}
.vb svg{width:20px;height:20px}
.vb.rec{background:#ff4b4b;color:#fff}
.vb.rec.on{animation:recpulse .8s infinite alternate}
@keyframes recpulse{to{box-shadow:0 0 0 7px rgba(255,75,75,.3)}}
.vb:disabled{opacity:.35}
.vfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.vfoot span{font-weight:700;color:#5b6380}
#vDone{padding:12px 26px;border-radius:16px;background:var(--go);color:#fff;font-size:17px;font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.2)}
#trafui{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:12px;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:4;pointer-events:none}
.tb{pointer-events:auto;flex:1;max-width:130px;height:92px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:16px;font-weight:900;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.25);touch-action:none;-webkit-user-select:none;user-select:none}
#tHand{background:#ff8a1f}#tLook{background:#3a8dff}#tWalk{background:#2fbf71}
.tb svg{width:40px;height:40px}
.tb:active,.tb.on{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.tb.hint{animation:tbpulse .8s infinite alternate}
@keyframes tbpulse{to{box-shadow:0 0 0 6px rgba(255,255,255,.9),0 6px 0 rgba(0,0,0,.25)}}
.tb.nudge{animation:tbnudge .45s}
@keyframes tbnudge{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#carsetup{position:fixed;inset:0;z-index:3;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:calc(70px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(120% 80% at 50% 0%,#3b4fb8 0%,#1a2350 70%)}
#carsetup h2{margin:4px 0 0;font-size:24px;font-weight:900;color:var(--sun);text-align:center}
.pickrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;width:min(640px,100%)}
.opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px 10px;border-radius:18px;background:rgba(255,255,255,.1);border:3px solid transparent;min-width:0;transition:transform .12s}
.opt canvas{width:100%;max-width:130px;aspect-ratio:120/85;height:auto;border-radius:12px;display:block}
.opt span{font-size:14px;font-weight:800;text-align:center;line-height:1.15}
.opt.sel{background:rgba(255,210,63,.2);border-color:var(--sun);transform:scale(1.04)}
.medals{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:800;min-height:44px;font-size:16px}
.medals .m{display:flex;align-items:center;gap:4px;font-size:18px}
.toggles{display:flex;flex-direction:column;gap:8px;width:min(420px,100%)}
.tog{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.1);font-size:16px;font-weight:800;text-align:left}
.tog i{flex:none;position:relative;width:52px;height:30px;border-radius:15px;background:rgba(255,255,255,.25);transition:background .15s}
.tog i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.tog[aria-pressed="true"] i{background:var(--go)}
.tog[aria-pressed="true"] i::after{left:25px}
#tiltNote{margin:0;max-width:420px;font-size:14px;font-weight:600;color:#ffd0d0;text-align:center}
#goRace{padding:16px 52px;border-radius:999px;background:var(--go);color:#fff;font-size:28px;font-weight:900;box-shadow:0 7px 0 #1a8a45}
#goRace:active{transform:translateY(4px);box-shadow:0 3px 0 #1a8a45}
#tur{right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(162px + env(safe-area-inset-bottom,0px));width:80px;height:60px;border-radius:20px;font-size:14px;
  background:linear-gradient(to top,var(--boost) var(--fill,0%),rgba(16,22,54,.65) var(--fill,0%));border:3px solid #ffd27a!important}
#tur.ready{animation:pulse .7s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 22px 6px rgba(255,170,40,.8),0 6px 0 rgba(0,0,0,.3)}}

/* result panel */
#panel{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,14,40,.55);z-index:6;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
#panel .box{width:min(360px,100%);background:#fff;color:#1a2350;border-radius:28px;padding:24px 20px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;gap:12px}
#panel h2{margin:0;font-size:30px;font-weight:900;text-wrap:balance}
#panel .stars{font-size:44px;letter-spacing:6px;color:#ffb400;line-height:1}
#panel .stars i{font-style:normal;color:#dfe3ef}
#panel p{margin:0;font-weight:500;font-size:17px;line-height:1.4}
#panel .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#panel button{padding:14px 20px;border-radius:18px;font-size:18px;font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.2)}
#panel .main{background:var(--go);color:#fff}
#panel .alt{background:#e8ecf7;color:#1a2350}
@media (prefers-reduced-motion:reduce){.vb.rec.on,#tur.ready,#horn.lit,.tb.hint,.tb.nudge{animation:none}.opt,.tog i,.tog i::after{transition:none}.card{transition:none}}
</style>

</head>
<body>
<canvas id="c"></canvas>

<div id="menu">
  <h1>Хүүгийн тоглоомууд</h1>
  <p class="sub">Аль нэгийг нь сонгоод тогло</p>
  <div class="menubtns">
    <button id="musicBtn" class="mbtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l11-2v12" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.8" fill="currentColor"/><circle cx="17.5" cy="16" r="2.8" fill="currentColor"/></svg><span>Хөгжим</span></button>
    <button id="voiceBtn" class="mbtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span>Аавын дуу бичих</span></button>
  </div>
  <div class="cards">
    <button class="card car" id="pickCar">
      <svg viewBox="0 0 200 96" aria-hidden="true"><path d="M30 92 L85 20 L115 20 L170 92Z" fill="#5b6070"/><path d="M98 26h4v10h-4zM97 46h6v14h-6zM96 70h8v18h-8z" fill="#fff"/><g transform="translate(100 88)"><ellipse cx="0" cy="0" rx="34" ry="5" fill="rgba(0,0,0,.3)"/><rect x="-32" y="-16" width="12" height="16" rx="3" fill="#1b1d24"/><rect x="20" y="-16" width="12" height="16" rx="3" fill="#1b1d24"/><path d="M-33-6v-20q2-8 10-9h46q8 1 10 9v20q0 4-5 4h-56q-5 0-5-4z" fill="#ffd23f"/><path d="M-22-35l7-16h30l7 16z" fill="#ffe27a"/><path d="M-17-35l5-12h24l5 12z" fill="#1d2b45"/><rect x="-31" y="-28" width="14" height="6" rx="2" fill="#ff3030"/><rect x="17" y="-28" width="14" height="6" rx="2" fill="#ff3030"/></g></svg>
      <b>Уралдаан</b>
      <span>Машин, газраа сонгоод уралдаж медаль ав!</span>
    </button>
    <button class="card cut" id="pickCut">
      <svg viewBox="0 0 200 96" aria-hidden="true"><rect x="60" y="0" width="80" height="96" fill="#d8f1ff"/><rect x="82" y="2" width="36" height="46" rx="18" fill="#3d8f36"/><g fill="#dff5b0" stroke="#3d8f36" stroke-width="3"><ellipse cx="92" cy="74" rx="15" ry="8"/><ellipse cx="112" cy="84" rx="15" ry="8"/></g><path d="M40 56 L150 50 L150 60 L48 62Z" fill="#dfeaf6" stroke="#9fb6cf" stroke-width="2"/><rect x="150" y="48" width="48" height="14" rx="6" fill="#8a4b2a"/><circle cx="165" cy="55" r="2.5" fill="#f2d3b3"/><circle cx="182" cy="55" r="2.5" fill="#f2d3b3"/></svg>
      <b>Хурц хутга</b>
      <span>Дэлгэцээ дараад барьвал хутга хэрчинэ. Модон банзыг бүү хэрчээрэй!</span>
    </button>
      <button class="card hero" id="pickHero">
      <svg viewBox="0 0 200 96" aria-hidden="true"><rect x="10" y="20" width="44" height="76" fill="#6c7bd9"/><rect x="140" y="8" width="50" height="88" fill="#e98b6d"/><circle cx="165" cy="6" r="6" fill="#ffd23f"/><line x1="110" y1="56" x2="165" y2="6" stroke="#fff" stroke-width="3"/><path d="M98 50 q-18 2-22 20 l16-6z" fill="#ff8a1f"/><rect x="96" y="48" width="20" height="20" rx="8" fill="#2fbf71"/><circle cx="106" cy="40" r="10" fill="#f2c29b"/><rect x="96" y="36" width="20" height="4" fill="#ff8a1f"/><circle cx="102" cy="40" r="3.5" fill="#bff3ff"/><circle cx="110" cy="40" r="3.5" fill="#bff3ff"/><path d="M60 40 l4 8 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z" fill="#ffd23f"/></svg>
      <b>Олсон баатар</b>
      <span>Олсоор савлаж муур аварч, од цуглуул!</span>
    </button>
    <button class="card santa" id="pickSanta">
      <svg viewBox="0 0 200 96" aria-hidden="true"><circle cx="170" cy="18" r="12" fill="#fff6d0"/><rect x="30" y="56" width="60" height="40" fill="#4fa3e0"/><path d="M24 58 L60 32 L96 58Z" fill="#3d5a80"/><rect x="72" y="32" width="10" height="20" fill="#9a4a3a"/><rect x="42" y="66" width="14" height="12" fill="#ffd86b"/><rect x="66" y="66" width="14" height="12" fill="#ffd86b"/><path d="M110 40 h50 q8 0 6 14 h-52z" fill="#fff"/><path d="M112 42 h46 q6 0 4 10 h-48z" fill="#d62a2a"/><circle cx="130" cy="30" r="8" fill="#f2c29b"/><path d="M122 26 q8-16 20-8 l-4 6z" fill="#e23434"/><ellipse cx="130" cy="36" rx="7" ry="5" fill="#fff"/><ellipse cx="150" cy="34" rx="8" ry="9" fill="#8a3a8a"/></svg>
      <b>Өвлийн өвгөн</b>
      <span>Бэлэг хүргээд Хойд туйл руу нис!</span>
    </button>
    <button class="card traffic" id="pickTraffic">
      <svg viewBox="0 0 200 96" aria-hidden="true"><rect x="0" y="58" width="200" height="30" fill="#4d5160"/><g fill="#fff"><rect x="78" y="60" width="44" height="5"/><rect x="78" y="70" width="44" height="5"/><rect x="78" y="80" width="44" height="5"/></g><rect x="150" y="18" width="4" height="44" fill="#5a606e"/><rect x="139" y="0" width="26" height="38" rx="5" fill="#2a2d38"/><circle cx="152" cy="10" r="6" fill="#4a2224"/><circle cx="152" cy="27" r="6" fill="#2fd36b"/><rect x="102" y="30" width="16" height="30" rx="7" fill="#2a9d8f"/><circle cx="110" cy="23" r="8" fill="#3b2a1e"/><rect x="85" y="42" width="12" height="18" rx="5" fill="#e23b4a"/><circle cx="91" cy="36" r="6.5" fill="#5a3a22"/><path d="M96 34a6.5 6.5 0 0 0-11 0z" fill="#3a8dff"/><path d="M96 48 L104 44" stroke="#f2c29b" stroke-width="4" stroke-linecap="round"/></svg>
      <b>Гэрлэн дохио</b>
      <span>Том хүний гараас бариад зам зөв гарч сур!</span>
    </button>
  </div>
</div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,DPR=1,game=null,last=0,T=0;
const FONT="'Rubik',system-ui,sans-serif";
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), pick=a=>a[Math.floor(Math.random()*a.length)];
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);if(game&&game.resize)game.resize();}
addEventListener('resize',resize);resize();

/* ---------- sound ---------- */
let AC=null;
function audio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();try{if(MUSIC.sel>=0&&!MUSIC.timer&&!MUSIC.paused)musStart();}catch(_){}}catch(e){AC=null}}
function tone(f,d,type='square',vol=.06,slide=0){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}
function noise(d,vol=.12,freq=2000){if(!AC)return;const t=AC.currentTime,len=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,len,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<len;i++)a[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;const g=AC.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);}

/* ---------- helpers ---------- */
function circ(c,x,y,r){c.beginPath();c.arc(x,y,Math.max(0,r),0,Math.PI*2);c.fill();}
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),0,0,Math.PI*2);c.fill();}
function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,Math.max(0,Math.min(r,Math.abs(w)/2,Math.abs(h)/2)));else c.rect(x,y,w,h);c.fill();}
function txt(s,x,y,size,col,align='center',weight=900,stroke){ctx.font=`${weight} ${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline='middle';if(stroke){ctx.lineWidth=size*.18;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(s,x,y);}ctx.fillStyle=col;ctx.fillText(s,x,y);}

/* ---------- input ---------- */
const keys={};
document.querySelectorAll('#carui .b').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();audio();keys[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}};
  const off=()=>{keys[k]=false;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,off));
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
const KM={ArrowLeft:'L',a:'L',ArrowRight:'R',d:'R',ArrowUp:'G',w:'G',ArrowDown:'B',s:'B',Shift:'T',n:'T',h:'H'};
addEventListener('keydown',e=>{if(KM[e.key]){keys[KM[e.key]]=true;e.preventDefault()}if(e.key===' '){keys.SP=true;e.preventDefault()}audio();});
addEventListener('keyup',e=>{if(KM[e.key])keys[KM[e.key]]=false;if(e.key===' ')keys.SP=false;});
let holdPtr=false;const ptr={x:0,y:0};
cv.addEventListener('pointermove',e=>{ptr.x=e.clientX;ptr.y=e.clientY;});
cv.addEventListener('pointerdown',e=>{audio();holdPtr=true;ptr.x=e.clientX;ptr.y=e.clientY;e.preventDefault();if(game&&game.tap)game.tap(e.clientX,e.clientY);});
addEventListener('pointerup',()=>holdPtr=false);addEventListener('pointercancel',()=>holdPtr=false);
cv.addEventListener('contextmenu',e=>e.preventDefault());
const zones=new Map();
const zoneOf=x=>x<innerWidth/2?'L':'R';
cv.addEventListener('pointerdown',e=>{if(game&&game.zones){zones.set(e.pointerId,zoneOf(e.clientX));try{cv.setPointerCapture(e.pointerId)}catch(_){}}});
cv.addEventListener('pointermove',e=>{if(zones.has(e.pointerId))zones.set(e.pointerId,zoneOf(e.clientX));});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>cv.addEventListener(ev,e=>zones.delete(e.pointerId)));
function zoneOn(k){for(const v of zones.values())if(v===k)return true;return false;}

/* ---------- panel ---------- */
function panel(title,stars,msg,b1,f1,b2,f2){$('pt').textContent=title;const s=$('ps');s.hidden=stars==null;if(stars!=null)s.innerHTML=typeof stars==='string'?stars:'★'.repeat(stars)+'<i>'+'★'.repeat(3-stars)+'</i>';$('pm').textContent=msg;
  $('pb1').textContent=b1;$('pb1').onclick=()=>{$('panel').hidden=true;f1()};$('pb2').textContent=b2;$('pb2').onclick=()=>{$('panel').hidden=true;f2()};$('panel').hidden=false;}

/* =========================================================
   GAME 1: Racing — pick a vehicle and a place, pedals, rivals, medals
   ========================================================= */
const ROADW=2000;
const THEMES={
  ub:{name:'Улаанбаатар',sky:['#1f7bff','#a9d8ff'],sun:'#fff3a0',hills:['#6f8f6a','#9bb06e'],grass:['#a9b866','#b6c470'],road:['#55596a','#5e6274'],rumble:['#c4272f','#0a5aa8'],lane:'#ffffff',sprites:['ger','apt','ger','flag','ger','apt'],ub:true},
  forest:{name:'Ой',sky:['#3a8dff','#a8e4ff'],sun:'#fff3a0',hills:['#7b8fd6','#4fbf6a'],grass:['#3db657','#48c763'],road:['#5d6273','#666b7d'],rumble:['#ff4b4b','#ffffff'],lane:'#f4f4f4',sprites:['tree','tree','tree','bush','flower']},
  city:{name:'Хот',sky:['#4aa3ff','#cfeaff'],sun:'#fff3a0',hills:['#a9b6d9','#8f9cc0'],grass:['#b6bcc8','#c2c8d3'],road:['#4d5160','#555a6a'],rumble:['#ffd23f','#2a2d38'],lane:'#ffffff',sprites:['bld','bld','bld','lamp','sign'],skyline:true},
  desert:{name:'Цөл',sky:['#ff9f5a','#ffe2a6'],sun:'#fff6c8',hills:['#d9894e','#e8a965'],grass:['#efc26a','#e6b65c'],road:['#7a6a5c','#837262'],rumble:['#ff4b4b','#ffffff'],lane:'#fff3d6',sprites:['cactus','cactus','rock','cactus']},
  snow:{name:'Цас',sky:['#8fb8e6','#eaf4ff'],sun:'#ffffff',hills:['#b9cbe6','#dfe9f7'],grass:['#f4f8ff','#e4ecf8'],road:['#6a7286','#737b90'],rumble:['#3a8dff','#ffffff'],lane:'#ffffff',sprites:['pine','pine','snowman','pine'],snow:true},
  night:{name:'Шөнө',sky:['#0b1235','#2c3a78'],moon:true,hills:['#1f2858','#173a33'],grass:['#16402a','#1a4a31'],road:['#2e3242','#353a4c'],rumble:['#ff4b4b','#dddddd'],lane:'#ffe066',sprites:['lamp','tree','lamp','bush'],night:true,stars:true},
};
const VEHS=[{type:'race',name:'Уралдааны',paint:'#2b7de9'},{type:'police',name:'Цагдаа'},{type:'ambulance',name:'Түргэн тусламж'},{type:'fire',name:'Гал команд'},{type:'taxi',name:'Такси'}];
const SIREN={police:1,ambulance:1,fire:1};
const MEDAL_COL=['#ffcf33','#d5dbe4','#e0965a','#6fa8ff'],MEDAL_DARK=['#c99a0e','#97a1b0','#a8642e','#3d6fd1'];

function shade(hex,amt){const n=parseInt(hex.slice(1),16);const f=v=>clamp(Math.round(v+amt),0,255);return '#'+((1<<24)+(f(n>>16)<<16)+(f(n>>8&255)<<8)+f(n&255)).toString(16).slice(1);}
function medalSVG(rank,size){const c=MEDAL_COL[rank-1],d=MEDAL_DARK[rank-1];
  return `<svg width="${size}" height="${Math.round(size*1.25)}" viewBox="0 0 80 100" aria-hidden="true"><path d="M20 0h15l11 36H31z" fill="#ff4b4b"/><path d="M60 0H45L34 36h15z" fill="#3a8dff"/><circle cx="40" cy="64" r="30" fill="${d}"/><circle cx="40" cy="64" r="24" fill="${c}"/><text x="40" y="74" text-anchor="middle" font-family="Rubik,system-ui,sans-serif" font-weight="900" font-size="28" fill="${d}">${rank}</text></svg>`;}

/* ---- tilt steering ---- */
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const tilt={on:store.get('carTilt',true),auto:store.get('carAuto',true),raw:0,rawA:0,ok:false,flip:null,corr:0,base:0,denied:false};
function scrAngle(){const a=(screen.orientation&&screen.orientation.angle!=null)?screen.orientation.angle:(window.orientation||0);return((a%360)+360)%360;}
addEventListener('devicemotion',e=>{const g=e.accelerationIncludingGravity;if(!g||g.x==null||g.y==null)return;tilt.ok=true;const a=scrAngle();
  const sx=a===90?-g.y:a===180?-g.x:a===270?g.y:g.x;tilt.rawA=clamp(-sx/9.81,-1,1);
  const f=tilt.flip!=null?tilt.flip:(isIOS?-1:1);tilt.raw=tilt.rawA*f;});
addEventListener('deviceorientation',e=>{if(e.gamma==null||tilt.flip!=null||scrAngle()!==0)return;
  if(Math.abs(e.gamma)>8&&Math.abs(tilt.rawA)>.12){tilt.corr+=Math.sign(e.gamma)*Math.sign(tilt.rawA);if(tilt.corr>=6)tilt.flip=1;if(tilt.corr<=-6)tilt.flip=-1;}});
function askTilt(){try{const P=[];
  if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function')P.push(DeviceMotionEvent.requestPermission());
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')P.push(DeviceOrientationEvent.requestPermission().catch(()=>'granted'));
  if(P.length)Promise.all(P).then(r=>{tilt.denied=r[0]!=='granted';tiltUI();}).catch(()=>{tilt.denied=true;tiltUI();});}catch(e){}}
function tiltUI(){const t=$('togTilt'),a=$('togAuto');if(!t)return;t.setAttribute('aria-pressed',tilt.on);a.setAttribute('aria-pressed',tilt.auto);
  const n=$('tiltNote');n.hidden=!(tilt.on&&tilt.denied);n.textContent='Утас хөдөлгөөн мэдрэх зөвшөөрөл өгөөгүй байна. Сумтай товчоор жолоодно.';}
function tiltSteer(){const v=tilt.raw-tilt.base,d=.06;const m=Math.abs(v)<d?0:(Math.abs(v)-d)*Math.sign(v);return clamp(m/.36,-1,1);}

/* ---- sirens & horn ---- */
let sirenNode=null;
function sirenStart(type){if(!AC||sirenNode)return;try{const o=AC.createOscillator(),l=AC.createOscillator(),lg=AC.createGain(),g=AC.createGain();
  o.type='triangle';o.frequency.value=type==='fire'?620:760;l.type=type==='police'?'sine':'square';l.frequency.value=type==='police'?1.6:1.1;lg.gain.value=type==='police'?260:150;
  l.connect(lg);lg.connect(o.frequency);g.gain.value=.07;o.connect(g);g.connect(AC.destination);o.start();l.start();sirenNode={o,l};}catch(e){}}
function sirenStop(){if(sirenNode){try{sirenNode.o.stop();sirenNode.l.stop()}catch(e){}sirenNode=null;}}
function hornBeep(){tone(392,.35,'sawtooth',.045);tone(494,.35,'sawtooth',.035);}

/* ---- vehicles (seen from behind; origin = ground centre) ---- */
function tails(c,x1,y,w,h,brk){if(brk){c.shadowColor='#ff2020';c.shadowBlur=w*.8;}c.fillStyle=brk?'#ff3b3b':'#a8202a';rr(c,x1,y,w,h,Math.min(5,h/2));rr(c,-x1-w,y,w,h,Math.min(5,h/2));c.shadowBlur=0;}
function lightbar(c,y,w,h,on,cols){c.fillStyle='#2a2d38';rr(c,-w/2,y,w,h,h/2);const ph=Math.floor(T*8)%2;
  for(let i=0;i<2;i++){const lit=on&&ph===i;c.fillStyle=lit?cols[i]:shade(cols[i],-110);if(lit){c.shadowColor=cols[i];c.shadowBlur=w*.6;}rr(c,-w/2+2+i*(w/2-1),y+2,w/2-3,h-4,Math.max(1,(h-4)/2));c.shadowBlur=0;}}
function plate(c,y,w,h,text){c.fillStyle='#ffffff';rr(c,-w/2,y,w,h,3);c.fillStyle='#1a2350';c.font=`800 ${h*.7}px ${FONT}`;c.textAlign='center';c.textBaseline='middle';c.fillText(text,0,y+h*.55);}
function vSport(c,cw,ch,paint,brk){
  const top=shade(paint,30),dark=shade(paint,-45);
  c.fillStyle=paint;c.beginPath();c.moveTo(-cw*.5,-ch*.14);c.lineTo(-cw*.5,-ch*.46);c.quadraticCurveTo(-cw*.48,-ch*.62,-cw*.36,-ch*.64);c.lineTo(cw*.36,-ch*.64);c.quadraticCurveTo(cw*.48,-ch*.62,cw*.5,-ch*.46);c.lineTo(cw*.5,-ch*.14);c.quadraticCurveTo(cw*.5,-ch*.05,cw*.42,-ch*.05);c.lineTo(-cw*.42,-ch*.05);c.quadraticCurveTo(-cw*.5,-ch*.05,-cw*.5,-ch*.14);c.fill();
  c.fillStyle=top;c.beginPath();c.moveTo(-cw*.35,-ch*.63);c.lineTo(-cw*.24,-ch*.93);c.quadraticCurveTo(-cw*.22,-ch*.98,-cw*.15,-ch*.98);c.lineTo(cw*.15,-ch*.98);c.quadraticCurveTo(cw*.22,-ch*.98,cw*.24,-ch*.93);c.lineTo(cw*.35,-ch*.63);c.fill();
  c.fillStyle='#1d2b45';c.beginPath();c.moveTo(-cw*.28,-ch*.65);c.lineTo(-cw*.19,-ch*.89);c.lineTo(cw*.19,-ch*.89);c.lineTo(cw*.28,-ch*.65);c.fill();
  c.fillStyle='rgba(255,255,255,.25)';c.beginPath();c.moveTo(-cw*.16,-ch*.88);c.lineTo(-cw*.06,-ch*.88);c.lineTo(-cw*.16,-ch*.67);c.lineTo(-cw*.24,-ch*.67);c.fill();
  c.fillStyle=dark;rr(c,-cw*.47,-ch*.74,cw*.94,ch*.07,4);c.fillRect(-cw*.3,-ch*.68,cw*.04,ch*.06);c.fillRect(cw*.26,-ch*.68,cw*.04,ch*.06);
  tails(c,-cw*.47,-ch*.53,cw*.22,ch*.1,brk);
  c.fillStyle=dark;for(let i=0;i<4;i++)rr(c,-cw*.15,-ch*(.55-i*.065),cw*.3,ch*.035,2);
  c.fillStyle='#ffd23f';rr(c,-cw*.11,-ch*.27,cw*.22,ch*.1,3);c.fillStyle='#1a2350';c.font=`800 ${ch*.07}px ${FONT}`;c.textAlign='center';c.textBaseline='middle';c.fillText('ХҮҮ 01',0,-ch*.22);
  c.fillStyle='#555b66';circ(c,-cw*.3,-ch*.12,cw*.035);circ(c,cw*.3,-ch*.12,cw*.035);
}

    for(const s of stars){if(s.got||s.x<cam-40||s.x>cam+W+40)continue;const r=16*heroS,sq=Math.abs(Math.cos(t*3+s.r));ctx.save();ctx.translate(s.x,s.y+Math.sin(t*3+s.r)*5);ctx.scale(Math.max(.25,sq),1);
      for(const [col,sc] of[['#ffb400',1],['#ffe066',.6]]){ctx.fillStyle=col;ctx.beginPath();for(let i=0;i<10;i++){const a=i/10*Math.PI*2-Math.PI/2,rr2=(i%2?r*.45:r)*sc;ctx.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2);}ctx.fill();}ctx.restore();}
    const hand={x:p.x+8*heroS,y:p.y-8*heroS};
    if(anchor){ctx.strokeStyle='#ffffff';ctx.lineWidth=3.5*k;ctx.beginPath();ctx.moveTo(hand.x,hand.y);ctx.lineTo(anchor.x,anchor.y);ctx.stroke();ctx.strokeStyle='rgba(120,200,255,.6)';ctx.lineWidth=1.2*k;ctx.stroke();}
    drawHero(p.x,p.y,heroS);
    ctx.strokeStyle='#2fbf71';ctx.lineWidth=5*heroS;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.x+6*heroS,p.y-6*heroS);
    let ex,ey;if(anchor){const a=Math.atan2(anchor.y-hand.y,anchor.x-hand.x);ex=p.x+6*heroS+Math.cos(a)*14*heroS;ey=p.y-6*heroS+Math.sin(a)*14*heroS;}else{ex=p.x+16*heroS;ey=p.y+2*heroS;}ctx.lineTo(ex,ey);ctx.stroke();ctx.fillStyle='#ffd23f';circ(ctx,ex,ey,3.2*heroS);
    for(const q of parts){ctx.globalAlpha=Math.max(0,1-q.t);ctx.fillStyle=q.c;circ(ctx,q.x,q.y,4);}ctx.globalAlpha=1;
    ctx.restore();
    // HUD
    const top=12+(parseFloat(getComputedStyle(document.documentElement).paddingTop)||0);
    ctx.fillStyle='rgba(16,22,54,.55)';rr(ctx,12,top,112,48,20);
    ctx.fillStyle='#ffb400';ctx.beginPath();for(let i=0;i<10;i++){const a=i/10*Math.PI*2-Math.PI/2,r=i%2?6:14;ctx.lineTo(36+Math.cos(a)*r,top+24+Math.sin(a)*r);}ctx.fill();
    txt(String(score),58,top+25,26,'#fff','left',900);

    cats.forEach((c,i)=>{ctx.globalAlpha=c.saved?1:.35;drawCat(30+i*32,top+92,.85,c.saved?c.col:'#ffffff',c.saved);});ctx.globalAlpha=1;
    const bx=136,bw=Math.max(60,W-bx-80),by=top+20,pr=clamp(p.x/finishX,0,1);
    ctx.fillStyle='rgba(16,22,54,.45)';rr(ctx,bx,by,bw,10,5);ctx.fillStyle='#2fd36b';rr(ctx,bx,by,bw*pr,10,5);
    ctx.fillStyle='#fff';circ(ctx,bx+bw*pr,by+5,8);ctx.fillStyle='#2fbf71';circ(ctx,bx+bw*pr,by+5,5);
    for(let r=0;r<2;r++)for(let c=0;c<3;c++){ctx.fillStyle=(r+c)%2?'#111':'#fff';ctx.fillRect(bx+bw+4+c*5,by-2+r*5,5,5);}
    if(msgT>0){ctx.globalAlpha=Math.min(1,msgT*2);txt(msg,W/2,H*.3,msg.length>6?36:52,'#ffd23f','center',900,'#1a2350');ctx.globalAlpha=1;}
    else if(cheerT>0)txt('Браво!',W/2,H*.3,52,'#ffd23f','center',900,'#1a2350');
    if(hintT<99){const a=.6+.4*Math.sin(t*6);ctx.globalAlpha=a;txt('Дараад барь, тавь!',W/2,H*.93,22,'#fff','center',900,'#1a2350');ctx.globalAlpha=1;}
  }
  return {start,update,draw};
}

/* =========================================================
   GAME 4: Winter old man (Santa) — steer the sleigh, climb the chimney, room tasks
   ========================================================= */
function makeSanta(){
  const N=5,HOUSE=['#e85d5d','#4fa3e0','#f2b84b','#7bc47f','#b58be0','#f28fb2'],ROOF=['#7a3b2e','#3d5a80','#5b4b8a','#2f6b4f'];
  const SKIN=['#fbe3d3','#f7d9c6','#fde8da'],HAIR=['#3b2a1e','#7a4a24','#e0b54a','#c7642c','#f0d488'],BLANK=['#ff7a8a','#7ac7ff','#ffd166','#9be08a','#c9a0ff'];
  let state,houses,hits,sleigh,target,st,offset,snow,parts,room,flying,tapped,sx,sy,u,k,skyStars,starT,score,shaft,msg,msgT;
  function newHouses(){houses=[];for(let i=0;i<N;i++){const kids=[];const n=1+Math.floor(Math.random()*3);for(let j=0;j<n;j++)kids.push({skin:pick(SKIN),hair:pick(HAIR),blank:pick(BLANK),gift:null,z:rand(0,3)});houses.push({col:HOUSE[i%HOUSE.length],roof:pick(ROOF),kids,done:false,hh:rand(.85,1.05)});}}
  function start(){u=Math.min(W,H*.62)/400;k=H/800;newHouses();state='sky';st=0;offset=0;tapped=false;parts=[];flying=[];hits=[];score=0;skyStars=[];starT=0;msg='';msgT=0;
    snow=[];for(let i=0;i<70;i++)snow.push({x:rand(0,W),y:rand(0,H),r:rand(1,3),s:rand(20,60)});
    sleigh={x:W*.3,y:H*.22};}
  const hw=()=>Math.min(W/3.1,170),gap=()=>hw()*1.3,groundY=()=>H*.9;
  function houseX(i){const total=N*gap();return(((i*gap()+offset)%total)+total)%total-hw()*.6;}
  function chimney(i){const w=hw(),x=houseX(i),h=w*.75*houses[i].hh,top=groundY()-h;return{x:x+w*.7,y:top-w*.42};}
  function jingle(){[1318,1318,1318,0,1318,1318,1318].forEach((f,i)=>f&&setTimeout(()=>tone(f,.12,'triangle',.05),i*110));}
  function say(s,d){msg=s;msgT=d||1.5;}
  function burst(x,y,n,cols,r){for(let i=0;i<n;i++)parts.push({x,y,vx:rand(-180,180),vy:rand(-280,-40),t:0,c:pick(cols),r:r||3*u});}
  function chime(){tone(1046+score%6*60,.1,'square',.045);}

  /* ---- shaft (player-controlled) ---- */
  function setupShaft(dir){
    const SL=H*1.9,sw=Math.min(W*.62,280*u),x0=(W-sw)/2;
    shaft={dir,SL,sw,x0,sx:W/2,sy:dir>0?110*u:SL-30*u,items:[],sneeze:0,moved:0,start:0};
    shaft.start=shaft.sy;
    for(let i=0;i<10;i++)shaft.items.push({k:'star',x:x0+rand(.18,.82)*sw,y:rand(.12,.92)*SL});
    for(let i=0;i<3;i++)shaft.items.push({k:'cookie',x:x0+rand(.2,.8)*sw,y:rand(.2,.85)*SL});
    for(let i=0;i<3;i++)shaft.items.push({k:'soot',x:x0+rand(.25,.75)*sw,y:rand(.25,.8)*SL});
    parts=[];
  }
  function camY(){return clamp(shaft.sy-H*.5,-60*u,shaft.SL-H+40*u);}
  function updateShaft(dt){
    const cy=camY();
    if(holdPtr){const tx=ptr.x,ty=ptr.y+cy,dx=tx-shaft.sx,dy=ty-(shaft.sy-50*u),d=Math.hypot(dx,dy);
      if(d>8){const step=Math.min(150*k*dt,d);shaft.sx+=dx/d*step;shaft.sy+=dy/d*step;}}
    else if(shaft.dir>0)shaft.sy+=12*k*dt;
    shaft.sx=clamp(shaft.sx,shaft.x0+26*u,shaft.x0+shaft.sw-26*u);shaft.sy=clamp(shaft.sy,30*u,shaft.SL-10*u);
    shaft.moved=Math.max(shaft.moved,Math.abs(shaft.sy-shaft.start));
    shaft.sneeze=Math.max(0,shaft.sneeze-dt);
    const bx=shaft.sx,by=shaft.sy-50*u;
    for(const it of shaft.items){if(it.got)continue;if(Math.hypot(it.x-bx,it.y-by)<46*u){it.got=1;
      if(it.k==='star'){score++;chime();burst(it.x,it.y-cy,10,['#ffd23f','#fff3a0']);}
      else if(it.k==='cookie'){score+=2;noise(.12,.2,1800);setTimeout(()=>noise(.1,.15,1500),120);say('Ням-ням!',1);burst(it.x,it.y-cy,8,['#d9a066','#7a4a2b']);}
      else{shaft.sneeze=1.4;noise(.35,.3,800);tone(300,.3,'triangle',.06,300);say('Апчхи!',1.2);burst(it.x,it.y-cy,22,['rgba(40,35,35,.8)','rgba(80,70,70,.7)'],8*u);}}}
    if(shaft.dir>0&&shaft.sy>=shaft.SL-14*u){state='room';st=0;setupRoom();tone(392,.2,'triangle',.05);}
    if(shaft.dir<0&&shaft.sy<=34*u){state='rise';st=0;houses[target].done=true;parts=[];}
  }

  /* ---- room tasks ---- */
  function setupRoom(){voice('santa');
    const h=houses[target],n=h.kids.length,floor=H*.8;parts=[];
    let beds;
    if(W<H*.8){const bw=Math.min(W*.55,260),bh=bw*.46;beds=h.kids.map((kid,j)=>({kid,x:W-bw-12,y:floor-bh-j*(bh+18),w:bw,h:bh}));}
    else{const areaX=W*.4,areaW=W*.58,bw=Math.min(areaW/n-10,180*u),bh=bw*.55;beds=h.kids.map((kid,j)=>({kid,x:areaX+j*(areaW/n)+(areaW/n-bw)/2,y:floor-bh,w:bw,h:bh}));}
    const fw=Math.min(W*.4,230*u),fh=H*.26,fx=W*.03,fy=floor-fh;
    const stockings=h.kids.map((kid,i)=>({x:fx+fw*(i+.5)/n,y:fy+6*u,full:false,col:kid.blank}));
    room={beds,stockings,floor,fx,fy,fw,fh,cookies:3,plate:{x:fx+fw*.78,y:fy-12*u},wreath:{x:Math.min(W*.2,fx+fw*.5),y:H*.2,r:34*u,on:false},bag:{x:fx+fw*.62,y:floor-26*u},santaX:fx+fw*.32,happyT:0,chew:0};
  }
  function tasksLeft(){const r=room;return r.beds.filter(b=>!b.kid.gift).length+r.stockings.filter(s=>!s.full).length+r.cookies+(r.wreath.on?0:1);}
  function nextTarget(){const r=room;const b=r.beds.find(b=>!b.kid.gift&&!b.pending);if(b)return{x:b.x+b.w*.5,y:b.y+b.h*.3};
    const s=r.stockings.find(s=>!s.full);if(s)return{x:s.x,y:s.y+26*u};if(r.cookies)return{x:r.plate.x,y:r.plate.y};if(!r.wreath.on)return{x:r.wreath.x,y:r.wreath.y};return null;}
  function give(b){b.pending=1;flying.push({b,t:0,col:pick(['#ff4b4b','#2fd36b','#3a8dff','#ffb400','#ff5ea8']),rib:pick(['#ffd23f','#ffffff'])});tone(660,.1,'triangle',.06,300);}
  function roomTap(x,y){
    const r=room;
    for(const b of r.beds)if(!b.kid.gift&&!b.pending&&x>b.x-10&&x<b.x+b.w+10&&y>b.y-40*u&&y<b.y+b.h+14){give(b);return;}
    for(const s of r.stockings)if(!s.full&&Math.abs(x-s.x)<34*u&&y>s.y-14*u&&y<s.y+70*u){s.full=true;tone(880,.1,'triangle',.05,400);burst(s.x,s.y+30*u,10,['#ffd23f','#ff4b4b','#fff']);return;}
    if(r.cookies&&Math.hypot(x-r.plate.x,y-r.plate.y)<50*u){r.cookies--;r.chew=.6;score+=1;noise(.12,.22,1800);setTimeout(()=>noise(.1,.15,1500),110);burst(r.plate.x,r.plate.y,8,['#d9a066','#7a4a2b']);if(!r.cookies)say('Ням-ням!',1.2);return;}
    if(!r.wreath.on&&Math.hypot(x-r.wreath.x,y-r.wreath.y)<r.wreath.r*1.6){r.wreath.on=true;[784,988,1175].forEach((f,i)=>setTimeout(()=>tone(f,.12,'triangle',.05),i*90));burst(r.wreath.x,r.wreath.y,16,['#ffd23f','#ff4b4b','#7ac7ff']);return;}
  }
  function tap(x,y){
    if(POLE[state]){tapPole(x,y);return;}
    if(state==='factory'){tapFactory(x,y);return;}
    if(state==='gers'){tapGers();return;}
    if(state==='sky'){
      if(y<groundY()-hw()*1.45)return; // upper sky is for steering the sleigh
      for(const h of hits){if(x>h.x&&x<h.x+h.w&&y>h.y&&y<h.y+h.h&&!houses[h.i].done){target=h.i;state='fly';st=0;tapped=true;sx=sleigh.x;sy=sleigh.y;jingle();return;}}
    }else if(state==='room')roomTap(x,y);
  }
  function update(dt){
    st+=dt;msgT=Math.max(0,msgT-dt);
    for(const f of snow){f.y+=f.s*dt;f.x+=Math.sin(T+f.r*3)*8*dt;if(f.y>H){f.y=-5;f.x=rand(0,W);}}
    for(const q of parts){q.t+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=(q.g??500)*dt;}parts=parts.filter(q=>q.t<1);
    if(POLE[state]){updatePole(dt);return;}
    if(state==='factory'){updFactory(dt);return;}
    if(state==='gers'){updGers(dt);return;}
    if(state==='sky'){
      offset-=14*u*dt;
      const skyTop=H*.1,skyBot=groundY()-hw()*1.5;
      trail(sleigh.x,sleigh.y,u*1.3);
      if(holdPtr&&ptr.y<skyBot+20){const tx=clamp(ptr.x,W*.15,W*.48),ty=clamp(ptr.y,skyTop,skyBot);sleigh.x+=clamp(tx-sleigh.x,-140*k*dt,140*k*dt);sleigh.y+=clamp(ty-sleigh.y,-160*k*dt,160*k*dt);}
      else sleigh.y+=Math.sin(T*2)*6*dt;
      starT-=dt;if(starT<=0){starT=rand(.9,1.6);skyStars.push({x:W+20,y:rand(skyTop,skyBot),ph:rand(0,6)});}
      for(const s of skyStars){s.x-=55*u*dt;if(!s.got&&Math.hypot(s.x-sleigh.x,s.y-(sleigh.y-14*u))<48*u){s.got=1;score++;chime();burst(s.x,s.y,10,['#ffd23f','#fff3a0']);}}
      skyStars=skyStars.filter(s=>!s.got&&s.x>-30);
    }
    else if(state==='fly'){const c=chimney(target),e=Math.min(1,st/1.4),q=e*e*(3-2*e);sleigh.x=sx+(c.x+50*u-sx)*q;sleigh.y=sy+(c.y-70*u-sy)*q;if(st>=1.4){state='drop';st=0;}}
    else if(state==='drop'){if(st>=.9){state='down';st=0;setupShaft(1);noise(.4,.1,300);}}
    else if(state==='down'||state==='up')updateShaft(dt);
    else if(state==='room'){
      room.chew=Math.max(0,room.chew-dt);
      for(const f of flying){f.t+=dt*1.3;if(f.t>=1&&!f.done){f.done=1;f.b.kid.gift={col:f.col,rib:f.rib};f.b.pending=0;score++;
        burst(f.b.x+f.b.w*.85,f.b.y+f.b.h*.6,14,['#ffd23f','#fff3a0','#ff9f1a','#ff5ea8']);tone(1046,.12,'square',.05);setTimeout(()=>tone(1318,.16,'square',.05),90);}}
      flying=flying.filter(f=>!f.done);
      if(tasksLeft()===0){room.happyT+=dt;if(room.happyT<dt*1.5){[196,196,196].forEach((f,i)=>setTimeout(()=>tone(f,.3,'triangle',.07),i*280));}
        if(room.happyT>2.4){state='up';st=0;setupShaft(-1);}}
    }
    else if(state==='rise'){if(st>=.9){state='sky';st=0;
      const c=chimney(target);burst(c.x,c.y,24,['#ffd23f','#fff3a0','#ff5ea8','#7ac7ff']);
      if(houses.every(h=>h.done)){jingle();voice('great');setTimeout(()=>panel('Бүх хүүхэд бэлэгтэй боллоо!',3,`${score} од цуглууллаа. Одоо бяцхан туслахууд хүлээж байгаа Хойд туйл руу нисье!`,'Хойд туйл руу!',()=>startPole(),'Цэс',toMenu),900);}}}
  }

  /* ----- drawing helpers ----- */
  function drawSanta(x,y,s,mood,sooty){
    ctx.save();ctx.translate(x,y);
    ctx.fillStyle='#22202a';rr(ctx,-16*s,-9*s,14*s,9*s,4*s);rr(ctx,2*s,-9*s,14*s,9*s,4*s);
    ctx.fillStyle='#d62a2a';rr(ctx,-14*s,-22*s,11*s,15*s,4*s);rr(ctx,3*s,-22*s,11*s,15*s,4*s);
    ctx.fillStyle='#e23434';ell(ctx,0,-38*s,22*s,22*s);
    ctx.fillStyle='#fff';ctx.fillRect(-3*s,-58*s,6*s,36*s);
    ctx.fillStyle='#22202a';ctx.fillRect(-22*s,-34*s,44*s,7*s);ctx.fillStyle='#ffd23f';rr(ctx,-6*s,-35.5*s,12*s,10*s,2*s);ctx.fillStyle='#22202a';ctx.fillRect(-3*s,-32.5*s,6*s,4*s);
    const up=mood==='happy'||mood==='climb',wave=up?Math.sin(T*10)*.5:0;
    for(const side of[-1,1]){ctx.save();ctx.translate(side*19*s,-48*s);ctx.rotate(side>0?(up?-2.4+wave:-.4):(mood==='climb'?2.4-wave:.4));ctx.fillStyle='#e23434';rr(ctx,-5*s,0,10*s,22*s,5*s);ctx.fillStyle='#fff';ctx.fillRect(-5*s,16*s,10*s,4*s);ctx.fillStyle='#22202a';circ(ctx,0,24*s,5*s);ctx.restore();}
    ctx.fillStyle='#f6d2bd';circ(ctx,0,-66*s,12*s);
    ctx.fillStyle='#fff';ell(ctx,0,-56*s,14*s,11*s);circ(ctx,-9*s,-60*s,7*s);circ(ctx,9*s,-60*s,7*s);ell(ctx,0,-50*s,9*s,8*s);
    ctx.fillStyle='#f2f2f2';ell(ctx,-5*s,-61*s,6*s,3*s);ell(ctx,5*s,-61*s,6*s,3*s);
    ctx.fillStyle='rgba(255,120,130,.75)';circ(ctx,-8.5*s,-64.5*s,3.8*s);circ(ctx,8.5*s,-64.5*s,3.8*s);
    ctx.fillStyle='#22202a';if(mood==='chew'){ctx.fillRect(-6*s,-68.5*s,3.5*s,1.5*s);ctx.fillRect(3*s,-68.5*s,3.5*s,1.5*s);}else{circ(ctx,-4.5*s,-68*s,2.4*s);circ(ctx,4.5*s,-68*s,2.4*s);ctx.fillStyle='#fff';circ(ctx,-3.7*s,-68.9*s,.9*s);circ(ctx,5.3*s,-68.9*s,.9*s);ell(ctx,-5*s,-72.5*s,3.4*s,1.4*s);ell(ctx,5*s,-72.5*s,3.4*s,1.4*s);}
    ctx.fillStyle='#e8a07a';circ(ctx,0,-64*s,3*s);
    if(sooty){ctx.fillStyle='rgba(40,30,30,.55)';circ(ctx,-5*s,-66*s,6*s);circ(ctx,6*s,-62*s,5*s);ell(ctx,0,-44*s,14*s,8*s);}
    ctx.fillStyle='#e23434';ctx.beginPath();ctx.moveTo(-13*s,-74*s);ctx.quadraticCurveTo(-2*s,-100*s,18*s,-92*s);ctx.lineTo(13*s,-74*s);ctx.fill();
    ctx.fillStyle='#fff';rr(ctx,-15*s,-78*s,30*s,7*s,3.5*s);circ(ctx,19*s,-91*s,6.5*s);
    if(mood==='happy'){ctx.fillStyle='#fff';rr(ctx,18*s,-128*s,84*s,30*s,14*s);ctx.beginPath();ctx.moveTo(26*s,-100*s);ctx.lineTo(20*s,-90*s);ctx.lineTo(36*s,-100*s);ctx.fill();ctx.fillStyle='#d62a2a';ctx.font=`900 ${13*s}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Хо-хо-хо!',60*s,-113*s);}
    ctx.restore();
  }
  function drawDeer(x,y,s,ph){
    ctx.save();ctx.translate(x,y);
    ctx.fillStyle='#8a5a34';ell(ctx,0,0,20*s,10*s);
    ctx.strokeStyle='#6b4325';ctx.lineWidth=4*s;ctx.lineCap='round';
    for(const [lx,o] of [[-12,0],[-6,1],[8,0],[14,1]]){const sw=Math.sin(T*10+ph+o*2)*5*s;ctx.beginPath();ctx.moveTo(lx*s,6*s);ctx.lineTo(lx*s+sw,18*s);ctx.stroke();}
    ctx.fillStyle='#8a5a34';ctx.beginPath();ctx.moveTo(-14*s,-4*s);ctx.lineTo(-24*s,-18*s);ctx.lineTo(-16*s,-22*s);ctx.lineTo(-8*s,-6*s);ctx.fill();
    ell(ctx,-24*s,-20*s,8*s,6*s);ctx.fillStyle='#4a2f1a';circ(ctx,-31*s,-19*s,2.5*s);ctx.fillStyle='#fff';circ(ctx,-25*s,-22*s,1.6*s);
    ctx.strokeStyle='#c99a5b';ctx.lineWidth=2.2*s;ctx.beginPath();ctx.moveTo(-22*s,-25*s);ctx.lineTo(-20*s,-36*s);ctx.lineTo(-15*s,-40*s);ctx.moveTo(-20*s,-32*s);ctx.lineTo(-26*s,-37*s);ctx.stroke();
    ctx.fillStyle='#f7e7cf';circ(ctx,19*s,-3*s,4*s);
    ctx.fillStyle='#ffd23f';circ(ctx,-4*s,-9*s,2.5*s);
    ctx.restore();
  }

    rec=null;MUSIC.paused=false;renderVoice();musStart();};
  mr.start();rec={id,mr,t:setTimeout(stopRec,5000)};tone(880,.08,'sine',.05);renderVoice();}
function stopRec(){if(!rec)return;clearTimeout(rec.t);try{rec.mr.stop();}catch(e){rec=null;renderVoice();}}
const ICON_MIC='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const ICON_STOP='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>';
const ICON_PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>';
const ICON_DEL='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>';
function renderVoice(){const list=$('vList');if(!list)return;list.innerHTML='';let n=0;
  for(const [id,text] of VOICE_LINES){const has=!!VOICE.clips[id],recing=rec&&rec.id===id;if(has)n++;
    const row=document.createElement('div');row.className='vrow'+(has?' has':'');
    const t=document.createElement('div');t.className='vtxt';const b=document.createElement('b');b.textContent='«'+text+'»';const sm=document.createElement('small');sm.textContent=recing?'Бичиж байна… дахин дарж зогсоо':has?'Бичсэн':'Бичээгүй';t.append(b,sm);
    const br=document.createElement('button');br.type='button';br.className='vb rec'+(recing?' on':'');br.innerHTML=(recing?ICON_STOP:ICON_MIC);br.setAttribute('aria-label',recing?'Зогсоох':'Бичих');br.onclick=()=>startRec(id);
    const bp=document.createElement('button');bp.type='button';bp.className='vb';bp.innerHTML=ICON_PLAY;bp.disabled=!has;bp.setAttribute('aria-label','Сонсох');bp.onclick=()=>voice(id,true);
    const bd=document.createElement('button');bd.type='button';bd.className='vb del';bd.innerHTML=ICON_DEL;bd.disabled=!has;bd.setAttribute('aria-label','Устгах');bd.onclick=()=>{delete VOICE.clips[id];delete VOICE.buf[id];vDel(id);renderVoice();};
    row.append(t,br,bp,bd);list.append(row);}
  const c2=$('vCount');if(c2)c2.textContent=`${n}/${VOICE_LINES.length} бичсэн`;
  const vb=$('voiceBtn');if(vb)vb.querySelector('span').textContent=n?`Аавын дуу (${n})`:'Аавын дуу бичих';}

/* ---------- routing & loop ---------- */
function openGame(n){audio();$('stageBtn').hidden=n!=='santa';$('stagePick').hidden=true;$('menu').hidden=true;$('home').hidden=false;$('panel').hidden=true;$('carui').hidden=true;$('trafui').hidden=true;keys.W=false;
  if(n==='car'){game=null;buildCarSetup();$('carsetup').hidden=false;$('carsetup').scrollTop=0;return;}
  game=n==='hero'?makeHero():n==='santa'?makeSanta():n==='traffic'?makeTraffic():makeSlicer();game.start();}
$('togTilt').onclick=()=>{audio();tilt.on=!tilt.on;store.set('carTilt',tilt.on);if(tilt.on)askTilt();tone(tilt.on?880:440,.08,'triangle',.05);tiltUI();};
$('togAuto').onclick=()=>{audio();tilt.auto=!tilt.auto;store.set('carAuto',tilt.auto);tone(tilt.auto?880:440,.08,'triangle',.05);tiltUI();};
$('goRace').onclick=()=>{audio();if(tilt.on)askTilt();$('carsetup').hidden=true;$('carui').hidden=false;game=makeCar(VEHS[carSel.veh],carSel.loc);game.start();};
function toMenu(){if(game&&game.stop)game.stop();sirenStop();game=null;$('menu').hidden=false;$('home').hidden=true;$('carui').hidden=true;$('carsetup').hidden=true;$('trafui').hidden=true;$('stageBtn').hidden=true;$('stagePick').hidden=true;$('panel').hidden=true;for(const k in keys)keys[k]=false;voice('menu');}
$('pickCar').onclick=()=>openGame('car');$('pickCut').onclick=()=>openGame('cut');$('pickHero').onclick=()=>openGame('hero');$('pickSanta').onclick=()=>openGame('santa');
$('musicBtn').onclick=musNext;musUI();
$('stageBtn').onclick=()=>{audio();$('stagePick').hidden=false;};
$('spClose').onclick=()=>{$('stagePick').hidden=true;};
document.querySelectorAll('#stagePick .sp').forEach(b=>b.onclick=()=>{audio();$('stagePick').hidden=true;$('panel').hidden=true;if(game&&game.stage)game.stage(+b.dataset.st);});
$('voiceBtn').onclick=()=>{audio();vNote('');renderVoice();$('voicepanel').hidden=false;};
$('vDone').onclick=()=>{stopRec();$('voicepanel').hidden=true;};$('pickTraffic').onclick=()=>openGame('traffic');
$('tHand').onclick=()=>{if(game&&game.hand)game.hand();};
$('tLook').onclick=()=>{if(game&&game.look)game.look();};
(()=>{const b=$('tWalk');const on=e=>{e.preventDefault();audio();keys.W=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}};const off=()=>{keys.W=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,off));b.addEventListener('contextmenu',e=>e.preventDefault());})();$('home').onclick=toMenu;
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;T+=dt;if(game){game.update(dt);game.draw();}requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>

<script>if("serviceWorker" in navigator&&location.protocol.startsWith("http")){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
